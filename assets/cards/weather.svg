<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7fbf9"/>
      <stop offset="100%" stop-color="#e8f5ef"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" x2="1">
      <stop offset="0%" stop-color="#8adbc8"/>
      <stop offset="100%" stop-color="#6ec6b4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1f5a4e" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="10" y="10" rx="24" ry="24" width="740" height="230" fill="url(#bg)" stroke="#ffffff" filter="url(#shadow)"/>
  <rect x="28" y="28" rx="10" ry="10" width="10" height="28" fill="url(#mint)"/>
  <text x="48" y="49" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#2f3b3a" font-weight="700">🍡 Weather Ring</text>
  
  
  <g>
    <rect x="290" y="64" rx="15" ry="15" width="150" height="46" fill="#ffffff" stroke="#e2efe9" stroke-width="1"/>
    <text x="302" y="93" font-size="14" font-family="Segoe UI, Arial" fill="#334240">🌤️ Shanghai 7.5°C</text>
  </g>
  <g>
    <rect x="88" y="102" rx="15" ry="15" width="150" height="46" fill="#ffffff" stroke="#e2efe9" stroke-width="1"/>
    <text x="100" y="131" font-size="14" font-family="Segoe UI, Arial" fill="#334240">☀️ Paris 6.6°C</text>
  </g>
  <g>
    <rect x="522" y="102" rx="15" ry="15" width="150" height="46" fill="#ffffff" stroke="#78cab8" stroke-width="2"/>
    <text x="534" y="131" font-size="14" font-family="Segoe UI, Arial" fill="#334240">☀️ London 8.6°C</text>
  </g>
  <g>
    <rect x="84" y="182" rx="15" ry="15" width="150" height="46" fill="#ffffff" stroke="#e2efe9" stroke-width="1"/>
    <text x="96" y="211" font-size="14" font-family="Segoe UI, Arial" fill="#334240">☀️ New York 10.2°C</text>
  </g>
  <g>
    <rect x="526" y="182" rx="15" ry="15" width="150" height="46" fill="#ffffff" stroke="#e2efe9" stroke-width="1"/>
    <text x="538" y="211" font-size="14" font-family="Segoe UI, Arial" fill="#334240">☀️ Warsaw 9.3°C</text>
  </g>

  <!-- center detail area (no waves) -->
  <rect x="205" y="138" rx="18" ry="18" width="350" height="80" fill="#ffffff" stroke="#dfeee8"/>
  <text x="225" y="164" font-size="15" font-family="Segoe UI, Arial" fill="#2f3b3a" font-weight="700">Focus: London, United Kingdom</text>
  <text x="225" y="194" font-size="24" font-family="Segoe UI, Arial" fill="#2f3b3a" font-weight="800">☀️ 8.6°C · Clear</text>
  <text x="220" y="232" font-size="13" font-family="Segoe UI, Arial" fill="#8a9b98">Updated: 2026-03-14 20:49 UTC · Focus rotates each run</text>

</svg>