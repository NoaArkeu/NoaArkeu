name: Update Profile Cards

on:
  schedule:
    # 对应波兰时间凌晨 04:00 (UTC 03:00)
    - cron: "0 3 * * *"  
  # 保留手动触发开关，你想看效果时可以随时在 GitHub 页面点一下
  workflow_dispatch:
  # 建议增加一个 push 触发，当你修改了 scripts/build_cards.py 时自动运行
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/sync.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Generate cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: NoaArkeu
        run: python scripts/build_cards.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/cards/*.svg
          git diff --cached --quiet || git commit -m "chore: auto-update profile cards"
          git push
